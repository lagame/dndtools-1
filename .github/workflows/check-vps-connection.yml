name: Check VPS connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SSH and Docker access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing secret: ${name}" >&2; exit 1; }
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/dndtools_deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dndtools_deploy_key ~/.ssh/known_hosts

          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            -i ~/.ssh/dndtools_deploy_key -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          printf 'Host: '
          hostname
          printf 'Docker: '
          docker info --format '{{.ServerVersion}}'
          docker compose version
          printf 'Disk: '
          df -h / | tail -n 1
          printf 'D&D Tools directory: '
          if test -d /opt/dndtools; then echo present; else echo absent; fi
          printf 'Ports 8765 and 8766:\n'
          ss -ltn | awk 'NR == 1 || $4 ~ /:(8765|8766)$/'
          REMOTE
