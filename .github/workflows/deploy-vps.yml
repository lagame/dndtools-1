name: Deploy D&D Tools to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dndtools-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Deploy after a verified database backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing secret: ${name}" >&2; exit 1; }
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/dndtools_deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dndtools_deploy_key ~/.ssh/known_hosts

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="$VPS_USER@$VPS_HOST"
          script="/root/.cache/dndtools-deploy/update-$DEPLOY_SHA.sh"
          ssh_args=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10
            -i ~/.ssh/dndtools_deploy_key -p "$VPS_PORT")
          ssh "${ssh_args[@]}" "$remote" 'install -d -m 700 /root/.cache/dndtools-deploy'
          ssh "${ssh_args[@]}" "$remote" "umask 077; cat > '$script'" < scripts/update_vps.sh
          ssh "${ssh_args[@]}" "$remote" \
            "bash '$script' '$DEPLOY_SHA'; status=\$?; rm -f '$script'; exit \$status"
