services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DND_DB_NAME}
      MYSQL_USER: ${DND_DB_USER}
      MYSQL_PASSWORD: ${DND_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DND_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  volume_permissions:
    image: dndtools-app
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /var/www/static /var/www/media"]
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media

  app:
    build: .
    image: dndtools-app
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      DND_DB_HOST: db
      DND_DB_PORT: "3306"
      DND_STATIC_ROOT: /var/www/static
      DND_MEDIA_ROOT: /var/www/media
    depends_on:
      db:
        condition: service_healthy
      volume_permissions:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - static_data:/var/www/static
      - media_data:/var/www/media

  editorial_import_worker:
    image: dndtools-app
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      DND_DB_HOST: db
      DND_DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "process_catalog_imports"]
    restart: unless-stopped
    stop_grace_period: 20s

  proxy:
    image: caddy:2
    profiles: ["production"]
    environment:
      DND_PUBLIC_HOST: ${DND_PUBLIC_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  mysql_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
