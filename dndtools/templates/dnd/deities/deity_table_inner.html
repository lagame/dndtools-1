{% load i18n %}
{% load catalog_i18n %}
{% load catalog_sort %}
{# inner table is used if no pagination is required #}
{% load custom_filters %}

<table tabindex="0" {% if nostyle %}{% else %}class="common catalog-sortable"{% endif %}>
<tr>
  {% sortable_header paginator 'name' 'Deity name' %}
</tr>
    {% for deity in deity_list %}
        <tr>
            <td><a href="{{ deity.get_absolute_url }}">{% localized deity 'name' %}</a></td>
        </tr>
    {% endfor %}
</table>
