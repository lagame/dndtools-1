<details class="filter-panel" {% if form_submitted %}open{% endif %}>
  <summary>Filter results</summary>
  <form action="{{ request.path }}" method="get">
    <div class="form_settings">
      {{ filter.form.as_p }}
      <p><input class="submit" type="submit" name="_filter" value="Apply filters"></p>
    </div>
  </form>
</details>
